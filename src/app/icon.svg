<svg width="500" height="500" viewBox="0 0 500 500"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD966"/>
      <stop offset="100%" stop-color="#F4A300"/>
    </radialGradient>
  </defs>

  <g transform="translate(250 250)">
    <g fill="#F4A300">
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(0)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(30)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(60)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(90)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(120)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(150)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(180)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(210)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(240)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(270)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(300)"/>
      <polygon points="0,-220 12,-120 -12,-120" transform="rotate(330)"/>
    </g>

    <g fill="none" stroke="#F4A300" stroke-width="6" stroke-linecap="round">
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(15)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(45)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(75)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(105)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(135)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(165)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(195)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(225)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(255)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(285)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(315)"/>
      <path d="M0,-130 C10,-150 -10,-170 0,-190" transform="rotate(345)"/>
